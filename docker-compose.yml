services:
  db:
    image: postgres:15
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: heat-db-user
      POSTGRES_PASSWORD: heat-db-pwd
      POSTGRES_DB: heatingology-db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
